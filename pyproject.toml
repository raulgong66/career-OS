[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "0.1.0"
description = "CareerOS command line interface"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "PyYAML>=6.0",
  "jsonschema>=4.23.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.32",
  "python-dotenv>=1.0.0",
  "fastapi>=0.141.0",
  "pydantic>=2.13.4",
  "referencing>=0.37.0",
  "httpx>=0.28.1",
  "uvicorn>=0.51.0",
]

[project.scripts]
careeros = "careeros_cli.main:app"
careeros-api = "api.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["careeros"]